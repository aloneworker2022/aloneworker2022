[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cthulhu-note"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0",
    "httpx",
    "click",
    "rich>=13.0",
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
cthulhu-note = "cthulhu_note.cli:main"
cthulhu-note-web = "cthulhu_note.web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cthulhu_note*"]

[tool.setuptools.package-data]
cthulhu_note = ["web_template.html"]
