<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股網格交易系統</title>
<link rel="stylesheet" href="/css/main.css">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<nav class="navbar">
  <span class="brand">台股網格</span>
  <a href="/" class="active">網格設定</a>
  <a href="/backtest">回測</a>
  <a href="/monitor">監控</a>
</nav>

<div class="layout">
  <!-- 左側：設定面板 -->
  <aside class="sidebar">
    <div class="section-title">股票選擇</div>
    <div class="form-row">
      <label>股票代碼</label>
      <input type="text" id="ticker" placeholder="例：2330 或 0050" oninput="onTickerInput()" autocomplete="off">
      <div id="search-results" class="suggest-pills" style="margin-top:6px"></div>
      <div id="ticker-label" style="font-size:11px;color:var(--text-muted);margin-top:4px"></div>
    </div>
    <div class="form-row">
      <label>K線週期</label>
      <select id="period">
        <option value="3mo">3 個月</option>
        <option value="6mo">6 個月</option>
        <option value="1y" selected>1 年</option>
        <option value="2y">2 年</option>
        <option value="5y">5 年</option>
      </select>
    </div>
    <button class="btn btn-secondary" id="btn-load" onclick="loadStock()">載入 K 線</button>

    <div class="section-title" style="margin-top:8px">網格參數</div>
    <div class="form-row-2">
      <div>
        <label>上界（元）</label>
        <input type="number" id="upper" placeholder="例：1100" step="0.5">
      </div>
      <div>
        <label>下界（元）</label>
        <input type="number" id="lower" placeholder="例：850" step="0.5">
      </div>
    </div>
    <div class="form-row-2">
      <div>
        <label>格子數</label>
        <input type="number" id="n_grids" value="10" min="2" max="100">
      </div>
      <div>
        <label>每格股數</label>
        <input type="number" id="shares" value="1" min="1">
      </div>
    </div>

    <button class="btn btn-secondary" id="btn-suggest" onclick="suggestBounds()" style="margin-bottom:4px">
      自動建議上下界
    </button>
    <div id="suggest-pills" class="suggest-pills"></div>

    <button class="btn btn-primary" id="btn-calc" onclick="calculateGrid()" style="margin-top:8px">
      計算網格
    </button>
    <button class="btn btn-secondary" id="btn-monitor" onclick="addToMonitor()" style="margin-top:4px">
      加入監控
    </button>

    <div class="section-title" style="margin-top:8px">即時資訊</div>
    <div class="info-row"><span class="label">現價</span><span class="value value-orange" id="info-price">—</span></div>
    <div class="info-row"><span class="label">所需資金</span><span class="value value-blue" id="info-capital">—</span></div>
    <div class="info-row"><span class="label">每格預估獲利</span><span class="value value-green" id="info-profit">—</span></div>
    <div class="info-row"><span class="label">格子間距</span><span class="value" id="info-spacing">—</span></div>
    <div class="info-row"><span class="label">格線數</span><span class="value" id="info-grids">—</span></div>
  </aside>

  <!-- 中間：K線圖 -->
  <main class="main">
    <div class="chart-area">
      <div id="chart"></div>
    </div>
  </main>

  <!-- 右側：網格清單 -->
  <aside class="right-panel">
    <div class="section-title">網格清單</div>
    <table class="grid-table">
      <thead>
        <tr>
          <th>#</th>
          <th>格線價</th>
          <th>股數</th>
          <th>成本</th>
          <th>每格獲利</th>
        </tr>
      </thead>
      <tbody id="grid-tbody">
        <tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:20px">尚未計算</td></tr>
      </tbody>
    </table>
  </aside>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/chart.js"></script>
<script src="/js/grid_panel.js"></script>
<script>
  initChart("chart");
</script>
</body>
</html>
