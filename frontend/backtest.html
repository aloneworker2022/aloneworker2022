<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回測 — 台股網格交易系統</title>
<link rel="stylesheet" href="/css/main.css">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<nav class="navbar">
  <span class="brand">台股網格</span>
  <a href="/">網格設定</a>
  <a href="/backtest" class="active">回測</a>
  <a href="/monitor">監控</a>
</nav>

<div class="page">
  <h2 style="margin-bottom:16px;font-size:18px">網格交易回測</h2>

  <!-- 設定區 -->
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;align-items:end">
      <div class="form-row" style="margin:0">
        <label>股票代碼</label>
        <input type="text" id="bt-ticker" placeholder="例：2330">
      </div>
      <div class="form-row" style="margin:0">
        <label>上界（元）</label>
        <input type="number" id="bt-upper" placeholder="自動填入" step="0.5">
      </div>
      <div class="form-row" style="margin:0">
        <label>下界（元）</label>
        <input type="number" id="bt-lower" placeholder="自動填入" step="0.5">
      </div>
      <div class="form-row" style="margin:0">
        <label>格子數</label>
        <input type="number" id="bt-grids" value="10" min="2" max="100">
      </div>
      <div class="form-row" style="margin:0">
        <label>每格股數</label>
        <input type="number" id="bt-shares" value="1" min="1">
      </div>
      <div class="form-row" style="margin:0">
        <label>起始日期</label>
        <input type="date" id="bt-start" value="2023-01-01">
      </div>
      <div class="form-row" style="margin:0">
        <label>結束日期</label>
        <input type="date" id="bt-end">
      </div>
      <div class="form-row" style="margin:0">
        <label>初始資金（元）</label>
        <input type="number" id="bt-capital" value="100000" step="10000">
      </div>
      <div class="form-row" style="margin:0">
        <label>手續費折扣</label>
        <select id="bt-discount">
          <option value="1.0">無折扣（1折）</option>
          <option value="0.6" selected>六折</option>
          <option value="0.28">二八折</option>
          <option value="0.1">一折</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <button class="btn btn-secondary" style="flex:0 0 auto;padding:6px 12px" onclick="btSuggest()" title="ATR 自動建議上下界">自動填入</button>
        <button class="btn btn-primary" id="btn-backtest" onclick="runBacktest()">執行回測</button>
      </div>
    </div>
    <div id="bt-status" style="margin-top:8px;color:var(--text-muted);font-size:12px"></div>
  </div>

  <!-- 績效指標 -->
  <div class="stat-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-card">
      <div class="stat-label">總報酬率</div>
      <div class="stat-value" id="stat-return">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">年化報酬率</div>
      <div class="stat-value" id="stat-ann">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">最大回撤</div>
      <div class="stat-value value-red" id="stat-dd">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">夏普比率</div>
      <div class="stat-value" id="stat-sharpe">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">勝率</div>
      <div class="stat-value" id="stat-winrate">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">總交易次數</div>
      <div class="stat-value" id="stat-trades">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">總手續費</div>
      <div class="stat-value" id="stat-fees">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">期末資產</div>
      <div class="stat-value value-blue" id="stat-final">—</div>
    </div>
  </div>

  <!-- 買入持有比較 -->
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:16px;display:flex;gap:20px;align-items:center">
    <span style="color:var(--text-muted);font-size:13px">買入持有報酬率：</span>
    <span class="stat-value" id="stat-bh" style="font-size:16px">—</span>
    <span style="font-size:12px;color:var(--text-muted)">（同期間，100% 持有標的）</span>
  </div>

  <!-- 資產曲線圖 -->
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:16px">
    <div style="padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600">
      資產曲線
      <span style="font-size:11px;color:var(--blue);margin-left:12px">─ 網格策略</span>
      <span style="font-size:11px;color:var(--text-muted);margin-left:12px">- - 買入持有</span>
    </div>
    <div id="equity-chart" style="height:300px"></div>
  </div>

  <!-- 交易記錄 -->
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px">
    <div class="section-title">交易記錄</div>
    <div style="overflow-x:auto;max-height:300px;overflow-y:auto">
      <table class="records-table">
        <thead>
          <tr>
            <th>日期</th>
            <th>方向</th>
            <th>格子</th>
            <th>成交價</th>
            <th>股數</th>
            <th>金額</th>
            <th>手續費</th>
            <th>損益</th>
          </tr>
        </thead>
        <tbody id="trade-tbody">
          <tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px">執行回測後顯示</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/backtest_panel.js"></script>
<script>
  // 預設結束日期為今天
  document.getElementById("bt-end").value = new Date().toISOString().slice(0, 10);
  initEquityChart();
</script>
</body>
</html>
