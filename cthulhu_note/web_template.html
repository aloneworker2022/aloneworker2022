<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>cthulhu-note</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;
  --surface:#1a1a1a;
  --card:#242424;
  --card2:#2a2a2a;
  --border:rgba(255,255,255,.08);
  --text:#f0f0f0;
  --dim:#555;
  --lv0:#4a9eff;
  --lv1:#ff4e6a;
  --lv2:#ffb347;
  --lv3:#6bcb77;
  --pin:#ffd700;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{display:flex;flex-direction:column;height:100dvh}

/* ── header ── */
.hdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 6px}
.hdr-left{display:flex;align-items:center;gap:6px}
.hdr-title{font-size:.78rem;font-weight:700;letter-spacing:.08em;opacity:.45}
.lv-badge{font-size:.72rem;padding:3px 10px;border-radius:10px;font-weight:600;
  background:var(--lv0);color:#000;transition:background .3s}
.lv-badge.lv1{background:var(--lv1);color:#fff}
.lv-badge.lv2{background:var(--lv2);color:#000}
.lv-badge.empty{background:var(--surface);color:var(--dim);border:1px solid var(--border)}

/* ── 代辦三格 ── */
.pinned-wrap{flex-shrink:0;padding:4px 12px 8px}
.pinned-label{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--dim);margin-bottom:6px;padding:0 2px}
.pinned-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.p-card{background:var(--card);border-radius:14px;padding:10px;
  min-height:88px;cursor:pointer;position:relative;overflow:hidden;
  user-select:none;touch-action:none;border:1px solid var(--border);
  display:flex;flex-direction:column;justify-content:space-between;
  will-change:transform}
.p-card::before{content:'';position:absolute;top:0;left:0;right:0;
  height:2px;background:var(--pin);border-radius:14px 14px 0 0}
.p-card-txt{font-size:.78rem;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.p-card-hint{font-size:.6rem;color:var(--dim);margin-top:4px}
.p-card .swind{position:absolute;inset:0;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;opacity:0;pointer-events:none}

.p-slot{border:1.5px dashed rgba(255,255,255,.13);border-radius:14px;
  min-height:88px;display:flex;align-items:center;justify-content:center;
  font-size:1.6rem;color:rgba(255,255,255,.2);cursor:pointer;
  transition:all .15s;background:transparent}
.p-slot:active{opacity:.5;transform:scale(.96)}

/* ── divider ── */
.divider{flex-shrink:0;height:1px;background:var(--border);margin:0 12px}

/* ── main card area ── */
.card-area{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:16px 16px 8px;min-height:0;overflow:hidden}

.card-stage{width:100%;max-width:400px;position:relative}

.card{background:var(--card2);border-radius:22px;padding:26px 22px 20px;
  cursor:grab;touch-action:none;user-select:none;
  box-shadow:0 14px 48px rgba(0,0,0,.5);border:1px solid var(--border);
  position:relative;overflow:hidden;will-change:transform;
  animation:cIn .22s cubic-bezier(.25,.8,.25,1)}
.card:active{cursor:grabbing}
@keyframes cIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}

.card-stripe{position:absolute;top:0;left:0;right:0;height:3px;border-radius:22px 22px 0 0}
.card.lv0 .card-stripe{background:var(--lv0)}
.card.lv1 .card-stripe{background:var(--lv1)}
.card.lv2 .card-stripe{background:var(--lv2)}

.card-tag{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;
  opacity:.35;margin-bottom:10px}
.card-body{font-size:1.08rem;line-height:1.6;min-height:64px;
  display:flex;align-items:center;word-break:break-all}
.card-hints{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px}
.hint{font-size:.66rem;color:var(--dim);padding:3px 8px;
  border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--border)}

.card .swind{position:absolute;inset:0;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;opacity:0;pointer-events:none}

.card-nav{text-align:center;font-size:.72rem;color:var(--dim);margin-top:10px}

.empty-state{text-align:center;color:var(--dim);padding:32px 0}
.empty-state .e-icon{font-size:2.5rem;display:block;margin-bottom:8px}
.empty-state .e-txt{font-size:.88rem}

/* ── input bar ── */
.input-bar{flex-shrink:0;padding:8px 14px;
  padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--bg)}
.input-inner{display:flex;align-items:center;gap:8px;background:var(--surface);
  border-radius:26px;padding:9px 14px;border:1px solid var(--border)}
#inp{flex:1;background:none;border:none;color:var(--text);font-size:.95rem;
  outline:none;font-family:inherit;min-width:0}
#inp::placeholder{color:var(--dim)}
.send-btn{background:var(--lv1);border:none;border-radius:50%;
  width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:1rem;color:#fff;transition:opacity .1s}
.send-btn:active{opacity:.6}

/* ── modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px 28px;
  width:100%;max-width:480px;border:1px solid var(--border);border-bottom:none;
  transform:translateY(100%);transition:transform .25s ease}
.overlay.open .modal{transform:translateY(0)}
.modal h3{font-size:1rem;margin-bottom:4px}
.modal-ctx{font-size:.78rem;color:var(--dim);margin-bottom:14px}
.modal input{width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;color:var(--text);font-size:.95rem;
  outline:none;margin-bottom:14px;font-family:inherit}
.modal input:focus{border-color:rgba(255,255,255,.2)}
.modal-btns{display:flex;gap:8px}
.btn{flex:1;padding:13px;border-radius:13px;border:none;font-size:.9rem;
  cursor:pointer;font-family:inherit;transition:opacity .1s}
.btn:active{opacity:.6}
.btn-ok{background:var(--lv1);color:#fff}
.btn-cancel{background:var(--card);color:var(--dim);border:1px solid var(--border)}

/* ── toast ── */
.toast{position:fixed;bottom:88px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:rgba(40,40,40,.95);border:1px solid var(--border);
  backdrop-filter:blur(12px);padding:9px 18px;border-radius:20px;
  font-size:.82rem;z-index:60;opacity:0;
  transition:opacity .18s,transform .18s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <span>🦑</span>
    <span class="hdr-title">CTHULHU-NOTE</span>
  </div>
  <span class="lv-badge" id="lvbadge">Lv0</span>
</div>

<!-- 代辦三格 -->
<div class="pinned-wrap">
  <div class="pinned-label">代辦三格</div>
  <div class="pinned-grid" id="pgrid"></div>
</div>

<div class="divider"></div>

<!-- 主卡片 -->
<div class="card-area">
  <div class="card-stage">
    <div id="cstage"></div>
    <div class="card-nav" id="cnav"></div>
  </div>
</div>

<!-- 輸入 -->
<div class="input-bar">
  <div class="input-inner">
    <input id="inp" type="text" placeholder="新增到 Lv0 收件匣…" autocomplete="off" autocorrect="off">
    <button class="send-btn" onclick="sendInput()">↵</button>
  </div>
</div>

<!-- modal -->
<div class="overlay" id="overlay" onclick="overlayBg(event)">
  <div class="modal">
    <h3 id="mtitle"></h3>
    <div class="modal-ctx" id="mctx"></div>
    <input id="minp" type="text" placeholder="">
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="modalDone(null)">取消</button>
      <button class="btn btn-ok" onclick="modalDone(document.getElementById('minp').value)">確定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── state ────────────────────────────────────────────────────────────────────
let items   = [];
let curLv   = 0;
let cardIdx = {0:0, 1:0, 2:0};

// ── api ──────────────────────────────────────────────────────────────────────
async function req(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: body ? {'Content-Type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}
const GET   = p     => req('GET',    p);
const POST  = (p,b) => req('POST',   p, b);
const DEL   = p     => req('DELETE', p);
const PATCH = (p,b) => req('PATCH',  p, b);

async function reload() {
  items = await GET('/api/items');
  curLv = activeLv();
  render();
}

// ── helpers ──────────────────────────────────────────────────────────────────
const lvItems = lv => items.filter(i => i.level === lv);
const pinned  = ()  => items.filter(i => i.level === 1 && i.pinned);

// Lv0 清完才進 Lv1，Lv1 清完才進 Lv2
function activeLv() {
  if (lvItems(0).length > 0) return 0;
  if (lvItems(1).length > 0) return 1;
  if (lvItems(2).length > 0) return 2;
  return 0;
}

function clampIdx() {
  for (let lv=0;lv<3;lv++) {
    const n = lvItems(lv).length;
    cardIdx[lv] = n ? Math.min(cardIdx[lv], n-1) : 0;
  }
}

const delay = ms => new Promise(r => setTimeout(r, ms));
const esc   = s  => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── toast ────────────────────────────────────────────────────────────────────
let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('show'), 1800);
}

// ── modal ────────────────────────────────────────────────────────────────────
let _mres = null;
function openModal(title, ctx='', ph='') {
  document.getElementById('mtitle').textContent = title;
  document.getElementById('mctx').textContent   = ctx;
  const inp = document.getElementById('minp');
  inp.placeholder = ph; inp.value = '';
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => inp.focus(), 220);
  return new Promise(res => {
    _mres = res;
    inp.onkeydown = e => { if(e.key==='Enter') modalDone(inp.value); };
  });
}
function modalDone(val) {
  document.getElementById('overlay').classList.remove('open');
  if (_mres) { _mres(val===null ? null : (val||'').trim()); _mres = null; }
}
function overlayBg(e) { if(e.target===e.currentTarget) modalDone(null); }

// ── actions ──────────────────────────────────────────────────────────────────
async function doComplete(item) {
  await DEL(`/api/items/${item.id}`);
  clampIdx(); await reload(); toast('✓ 完成');
}
async function doDelete(item) {
  await DEL(`/api/items/${item.id}`);
  clampIdx(); await reload(); toast('✗ 已刪除');
}
async function doPromote(item) {        // Lv0 上滑 → Lv1
  if (lvItems(1).length >= 10) { toast('Lv1 已滿 10 格'); return; }
  await PATCH(`/api/items/${item.id}`, {level:1});
  clampIdx(); await reload(); toast('→ 升到 Lv1');
}
async function doPin(item) {            // Lv1 上滑 → 代辦三格
  if (pinned().length >= 3) { toast('代辦三格已滿'); return; }
  await PATCH(`/api/items/${item.id}`, {pinned:true});
  await reload(); toast('📌 已釘選');
}
async function doToLv2(item) {          // Lv1 雙擊
  const tag = await openModal('移動到 Lv2','項目：'+item.content,'分類 tag（可留空）');
  if (tag===null) return;
  const parent_tag = tag || item.content;
  const content    = tag ? `[${parent_tag}]${item.content}` : item.content;
  await PATCH(`/api/items/${item.id}`, {level:2, parent_tag, content});
  await reload(); toast('→ 移到 Lv2');
}
async function doToLv3(item) {          // Lv2 下滑
  await PATCH(`/api/items/${item.id}`, {level:3});
  clampIdx(); await reload(); toast('→ 移到 Lv3');
}
async function doCut(item) {            // Lv2 雙擊
  const content = await openModal('切項目','從：'+item.content,'新項目內容…');
  if (!content) return;
  await POST('/api/items', {content, level:0});
  await reload(); toast('✂ 已切出到 Lv0');
}
async function doAddPinned() {
  const content = await openModal('加入代辦三格','','輸入項目…');
  if (!content) return;
  if (lvItems(1).length >= 10) { toast('Lv1 已滿 10 格'); return; }
  await POST('/api/items', {content, level:1, pinned:true});
  await reload(); toast('📌 已加入');
}

function navigate(dir) {
  const list = lvItems(curLv);
  const next = cardIdx[curLv] + dir;
  if (next < 0 || next >= list.length) return;
  cardIdx[curLv] = next;
  renderCard();
}

// ── render ───────────────────────────────────────────────────────────────────
function render() {
  renderBadge();
  renderPinned();
  renderCard();
}

function renderBadge() {
  const b   = document.getElementById('lvbadge');
  const all = lvItems(0).length + lvItems(1).length + lvItems(2).length;
  if (all === 0) {
    b.textContent = '全清 ✓'; b.className = 'lv-badge empty'; return;
  }
  b.textContent = `Lv${curLv}`;
  b.className   = `lv-badge lv${curLv}`;
}

function renderPinned() {
  const grid = document.getElementById('pgrid');
  const ps   = pinned();
  let html   = '';
  ps.forEach(item => {
    html += `<div class="p-card" data-id="${item.id}">
      <div class="p-card-txt">${esc(item.content)}</div>
      <div class="p-card-hint">↑ 完成</div>
      <div class="swind"></div>
    </div>`;
  });
  for (let i=ps.length; i<3; i++) {
    html += `<div class="p-slot" onclick="doAddPinned()">+</div>`;
  }
  grid.innerHTML = html;

  grid.querySelectorAll('.p-card').forEach(el => {
    const item = ps.find(i => i.id === parseInt(el.dataset.id));
    swipeable(el, {
      up:   () => flyEl(el, () => doComplete(item)),
      down: null, left: null, right: null, dbl: null,
      thresh: 40
    });
  });
}

function renderCard() {
  const stage = document.getElementById('cstage');
  const nav   = document.getElementById('cnav');
  const list  = lvItems(curLv);

  if (list.length === 0) {
    const all = lvItems(0).length+lvItems(1).length+lvItems(2).length;
    if (all === 0) {
      stage.innerHTML = `<div class="empty-state"><span class="e-icon">🎉</span><span class="e-txt">全部清空了！</span></div>`;
    } else {
      stage.innerHTML = `<div class="empty-state"><span class="e-icon">✓</span><span class="e-txt">Lv${curLv} 已清空</span></div>`;
    }
    nav.textContent = ''; return;
  }

  const i    = cardIdx[curLv];
  const item = list[i];
  const HINTS = {
    0: ['↑ 升 Lv1','↓ 刪除'],
    1: ['↑ 釘選','↓ 刪除','← → 切換','×2 → Lv2'],
    2: ['↑ 完成','↓ → Lv3','← → 切換','×2 切項目'],
  };

  stage.innerHTML = `
    <div class="card lv${curLv}" id="ccard">
      <div class="card-stripe"></div>
      <div class="card-tag">Lv${item.level}${item.parent_tag?' · '+esc(item.parent_tag):''}</div>
      <div class="card-body">${esc(item.content)}</div>
      <div class="card-hints">${HINTS[curLv].map(h=>`<span class="hint">${h}</span>`).join('')}</div>
      <div class="swind"></div>
    </div>`;

  nav.textContent = list.length > 1 ? `${i+1} / ${list.length}` : '';

  const card = document.getElementById('ccard');
  const H = {
    0: { up:   () => flyCard('up',   () => doPromote(item)),
         down: () => flyCard('down', () => doDelete(item)),
         left: null, right: null, dbl: null },
    1: { up:   () => flyCard('up',   () => doPin(item)),
         down: () => flyCard('down', () => doDelete(item)),
         left: () => navigate(1), right: () => navigate(-1),
         dbl:  () => doToLv2(item) },
    2: { up:   () => flyCard('up',   () => doComplete(item)),
         down: () => flyCard('down', () => doToLv3(item)),
         left: () => navigate(1), right: () => navigate(-1),
         dbl:  () => doCut(item) },
  }[curLv];
  swipeable(card, H);
}

// ── fly animation ────────────────────────────────────────────────────────────
function flyCard(dir, action) {
  const card = document.getElementById('ccard');
  if (!card) { action(); return; }
  const T = {up:'translateY(-130%)',down:'translateY(130%)',left:'translateX(-130%)',right:'translateX(130%)'};
  card.style.transition = 'transform .24s ease,opacity .24s ease';
  card.style.transform  = T[dir];
  card.style.opacity    = '0';
  setTimeout(action, 240);
}
function flyEl(el, action) {
  el.style.transition = 'transform .22s ease,opacity .22s ease';
  el.style.transform  = 'translateY(-130%)';
  el.style.opacity    = '0';
  setTimeout(action, 220);
}

// ── swipe engine ─────────────────────────────────────────────────────────────
function swipeable(el, {up, down, left, right, dbl, thresh=55}) {
  let sx, sy, active=false, lastTap=0;
  const noLR = !left && !right;

  const start = (cx,cy) => { sx=cx; sy=cy; active=true; el.style.transition='none'; };
  const move  = (cx,cy) => {
    if (!active) return;
    const dx=cx-sx, dy=cy-sy, horiz=Math.abs(dx)>Math.abs(dy);
    let tx=0, ty=0;
    if (horiz && !noLR) tx = Math.sign(dx)*Math.min(Math.abs(dx), thresh*1.5);
    else if (!horiz)    ty = Math.sign(dy)*Math.min(Math.abs(dy), thresh*1.5);
    el.style.transform = `translate(${tx}px,${ty}px) rotate(${tx*.025}deg)`;

    const ov = el.querySelector('.swind');
    if (ov) {
      const abs = Math.max(Math.abs(tx),Math.abs(ty));
      if (abs > 14) {
        ov.style.opacity = Math.min(abs/(thresh*1.5), .85);
        if (!horiz) {
          ov.textContent   = dy<0?'↑':'↓';
          ov.style.background = dy<0?'rgba(107,203,119,.28)':'rgba(255,78,106,.28)';
        } else {
          ov.textContent   = dx>0?'←':'→';
          ov.style.background = 'rgba(255,255,255,.08)';
        }
      } else ov.style.opacity=0;
    }
  };
  const end = (cx,cy) => {
    if (!active) return; active=false;
    const dx=cx-sx, dy=cy-sy, horiz=Math.abs(dx)>Math.abs(dy);
    el.style.transition='transform .15s ease,opacity .15s ease';
    el.style.transform='';
    const ov=el.querySelector('.swind');
    if (ov) ov.style.opacity=0;

    if (horiz && !noLR) {
      if (dx< -thresh && left)  { left();  return; }
      if (dx>  thresh && right) { right(); return; }
    } else if (!horiz) {
      if (dy< -thresh && up)    { up();    return; }
      if (dy>  thresh && down)  { down();  return; }
    }
    if (dbl && Math.abs(dx)<12 && Math.abs(dy)<12) {
      const now=Date.now();
      if (now-lastTap<320) { dbl(); lastTap=0; }
      else lastTap=now;
    }
  };

  el.addEventListener('touchstart', e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
  el.addEventListener('touchmove',  e=>{ const t=e.touches[0]; move(t.clientX,t.clientY); if(e.cancelable)e.preventDefault(); },{passive:false});
  el.addEventListener('touchend',   e=>{ const t=e.changedTouches[0]; end(t.clientX,t.clientY); },{passive:true});
  el.addEventListener('mousedown',  e=>start(e.clientX,e.clientY));
  window.addEventListener('mousemove',  e=>{ if(e.buttons===1)move(e.clientX,e.clientY); });
  window.addEventListener('mouseup',    e=>{ if(active)end(e.clientX,e.clientY); });
}

// ── input ────────────────────────────────────────────────────────────────────
async function sendInput() {
  const inp=document.getElementById('inp');
  const val=inp.value.trim(); if(!val) return;
  inp.value='';
  await POST('/api/items',{content:val,level:0});
  await reload(); toast('+ 已加入 Lv0');
}
document.getElementById('inp').addEventListener('keydown',e=>{ if(e.key==='Enter')sendInput(); });

// ── boot ─────────────────────────────────────────────────────────────────────
reload();
</script>
</body>
</html>
