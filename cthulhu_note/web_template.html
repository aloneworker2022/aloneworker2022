<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>cthulhu-note</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;
  --surface:#1a1a1a;
  --card:#242424;
  --border:rgba(255,255,255,.08);
  --text:#f0f0f0;
  --dim:#555;
  --lv0:#4a9eff;
  --lv1:#ff4e6a;
  --lv2:#ffb347;
  --lv3:#6bcb77;
  --pin:#ffd700;
  --card-pin:var(--card);
  --card-lv0:var(--card);
  --card-lv1:var(--card);
  --card-lv2:var(--card);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{display:flex;flex-direction:column;height:100dvh}

/* ── scenes ── */
.scenes{flex:1;position:relative;overflow:hidden;min-height:0}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;
  transition:transform .32s cubic-bezier(.4,0,.2,1)}
#scene-pin{transform:translateX(0)}
#scene-lv {transform:translateX(100%)}
body.on-lv #scene-pin{transform:translateX(-40%)}
body.on-lv #scene-lv {transform:translateX(0)}

/* ── 代辦三格 ── */
.pin-hdr{flex-shrink:0;display:flex;align-items:center;justify-content:center;
  padding:18px 16px 8px;gap:6px}
.pin-hdr-title{font-size:.72rem;font-weight:700;letter-spacing:.1em;opacity:.4}
.pin-hdr-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.2)}
.pin-carousel{flex:1;overflow:hidden;position:relative;min-height:0}
.pin-track{display:flex;height:100%;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform}
.pin-slide{flex:0 0 100%;display:flex;align-items:center;justify-content:center;padding:16px 28px}

.pin-card{width:100%;max-width:340px;border-radius:4px;background:var(--card-pin);
  border:1px solid var(--border);padding:32px 26px 24px;
  position:relative;overflow:hidden;min-height:220px;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none;
  background-size:cover;background-position:center}
.pin-card-label{font-size:.6rem;letter-spacing:.08em;
  background:rgba(255,255,255,.5);color:rgba(0,0,0,.72);
  border-radius:6px;padding:2px 7px;margin-bottom:14px;
  display:inline-flex;align-items:center;gap:4px;
  position:relative;z-index:1}
.pin-card-body{font-size:1.2rem;line-height:1.6;flex:1;
  display:flex;align-items:center;word-break:break-all;position:relative;z-index:1}
.pin-card-hint{font-size:.68rem;color:var(--dim);margin-top:16px;
  display:flex;gap:10px;position:relative;z-index:1}
.pin-card .swind{position:absolute;inset:0;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:3.5rem;opacity:0;pointer-events:none;z-index:3}

.pin-slot{width:100%;max-width:340px;border-radius:4px;
  border:2px dashed rgba(255,255,255,.12);padding:32px 26px 24px;
  min-height:220px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;cursor:pointer;
  transition:all .15s;background:rgba(255,255,255,.015)}
.pin-slot:active{opacity:.6;transform:scale(.97)}
.pin-slot-icon{font-size:2.8rem;color:rgba(255,255,255,.18)}
.pin-slot-txt{font-size:.8rem;color:var(--dim)}

.pin-dots{flex-shrink:0;display:flex;justify-content:center;gap:7px;padding:12px 0 6px}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);transition:all .2s}
.dot.on{background:var(--pin);width:18px;border-radius:4px}

/* ── Lv 處理 ── */
.lv-hdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
.back-btn{display:flex;align-items:center;gap:5px;background:none;border:none;
  color:var(--dim);font-size:.82rem;cursor:pointer;font-family:inherit;padding:6px 0;transition:color .15s}
.back-btn:active{color:var(--text)}
.back-icon{font-size:.9rem}
.lv-badge{font-size:.72rem;font-weight:600;padding:4px 12px;border-radius:10px;
  background:rgba(255,255,255,.5);color:rgba(0,0,0,.8)}
.lv-badge.lv0,.lv-badge.lv1,.lv-badge.lv2{background:rgba(255,255,255,.5);color:rgba(0,0,0,.8)}
.lv-badge.empty{background:rgba(255,255,255,.25);color:rgba(0,0,0,.45);border:none}

.lv-area{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:12px 28px 8px;min-height:0;overflow:hidden}

.lv-card{width:100%;max-width:340px;border-radius:4px;background:var(--card);
  border:1px solid var(--border);padding:28px 24px 22px;
  position:relative;overflow:hidden;min-height:200px;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  cursor:grab;user-select:none;touch-action:none;will-change:transform;
  animation:cIn .22s cubic-bezier(.25,.8,.25,1);
  background-size:cover;background-position:center}
.lv-card:active{cursor:grabbing}
@keyframes cIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.lv-card.lv0{background-color:var(--card-lv0)}
.lv-card.lv1{background-color:var(--card-lv1)}
.lv-card.lv2{background-color:var(--card-lv2)}
.lv-card-tag{font-size:.6rem;letter-spacing:.06em;
  background:rgba(255,255,255,.5);color:rgba(0,0,0,.72);
  border-radius:6px;padding:2px 7px;margin-bottom:10px;
  display:inline-block;position:relative;z-index:1}
.lv-card-body{font-size:1.15rem;line-height:1.6;flex:1;
  display:flex;align-items:center;word-break:break-all;position:relative;z-index:1}
.lv-card-hints{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1}
.hint{font-size:.64rem;color:rgba(0,0,0,.72);padding:3px 8px;
  border-radius:8px;background:rgba(255,255,255,.5);border:none}
.lv-card .swind{position:absolute;inset:0;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:3.5rem;opacity:0;pointer-events:none;z-index:4}

.lv-nav{font-size:.72rem;color:var(--dim);text-align:center;margin-top:10px}

/* ── right tab bar (fixed, both scenes) ── */
.tab-bar{position:fixed;top:14px;right:0;z-index:40;
  display:flex;flex-direction:column;gap:3px;transition:opacity .2s}
.lv-tab{background:var(--surface);border:1px solid var(--border);border-right:none;
  border-radius:6px 0 0 6px;padding:10px 5px;cursor:pointer;
  color:var(--dim);font-family:inherit;font-size:.6rem;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  min-width:30px;transition:background .15s,color .15s}
.lv-tab.active{background:var(--lv1);color:#fff;border-color:transparent}
.lv-tab:active{filter:brightness(.75)}
.lv-tab-cnt{font-size:.68rem;font-weight:800}
.gear-tab{background:var(--card);margin-top:4px}

.empty-state{text-align:center;padding:16px}
.e-icon{font-size:2.8rem;display:block;margin-bottom:8px}
.e-txt{font-size:.88rem;color:var(--dim)}

/* ── card image overlay & controls ── */
.card-img-overlay{position:absolute;inset:0;background:rgba(0,0,0,.42);pointer-events:none;z-index:0}
.card-img-ctrl{position:absolute;top:8px;right:8px;z-index:5;display:flex;gap:5px;align-items:center}
.card-img-btn{width:28px;height:28px;border-radius:5px;
  background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:rgba(255,255,255,.85);font-size:.78rem;line-height:1;flex-shrink:0}
.card-img-btn:active{opacity:.6}
.card-img-del{width:22px;height:22px;border-radius:50%;
  background:rgba(220,50,50,.75);border:none;color:#fff;
  cursor:pointer;font-size:.7rem;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;line-height:1}
.card-img-del:active{opacity:.7}

/* ── input bar ── */
.input-bar{flex-shrink:0;padding:8px 14px;
  padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--bg)}
.input-inner{display:flex;align-items:center;gap:4px;background:var(--surface);
  border-radius:8px;padding:9px 12px;border:1px solid var(--border)}
#inp{flex:1;background:none;border:none;color:var(--text);font-size:.95rem;
  outline:none;font-family:inherit;min-width:0}
#inp::placeholder{color:var(--dim)}
.send-btn{background:none;border:none;border-radius:4px;
  width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:1.1rem;
  color:rgba(255,255,255,.4);line-height:1;transition:color .1s}
.send-btn:active{color:var(--text)}

/* ── modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:24px 24px 0 0;
  padding:24px 20px 28px;width:100%;max-width:480px;
  border:1px solid var(--border);border-bottom:none;
  transform:translateY(100%);transition:transform .25s ease}
.overlay.open .modal{transform:translateY(0)}
.modal h3{font-size:1rem;margin-bottom:4px}
.modal-ctx{font-size:.78rem;color:var(--dim);margin-bottom:14px}
.modal input{width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;color:var(--text);font-size:.95rem;
  outline:none;margin-bottom:14px;font-family:inherit}
.modal input:focus{border-color:rgba(255,255,255,.22)}
.modal-btns{display:flex;gap:8px}
.btn{flex:1;padding:13px;border-radius:13px;border:none;font-size:.9rem;
  cursor:pointer;font-family:inherit;transition:opacity .1s}
.btn:active{opacity:.6}
.btn-ok{background:var(--lv1);color:#fff}
.btn-cancel{background:var(--card);color:var(--dim);border:1px solid var(--border)}

/* ── toast ── */
.toast{position:fixed;bottom:84px;left:50%;
  transform:translateX(-50%) translateY(14px);
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.35);
  color:#111;font-weight:500;
  padding:9px 18px;border-radius:20px;font-size:.82rem;
  z-index:60;opacity:0;transition:opacity .18s,transform .18s;
  pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── themes ── */
body[data-theme="light"]{
  --bg:#f0f0f0;--surface:#fff;--card:#e8e8e8;--border:rgba(0,0,0,.1);
  --text:#1a1a1a;--dim:#999;--lv0:#1a7fd4;--lv1:#d63352;--lv2:#c8860a;--pin:#b8960a}
body[data-theme="green"]{
  --bg:#0d1f15;--surface:#142a1c;--card:#1a3526;--border:rgba(80,180,100,.15);
  --text:#d4edd8;--dim:#5a8a65;--lv0:#5bc4a0;--lv1:#e05a6a;--lv2:#d4a843;--pin:#a8d060}

/* ── background image layer ── */
#bg-layer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;
  transition:opacity .8s ease;opacity:0}
#bg-layer.on{opacity:1}
body.has-bg{--bg:transparent}
/* Bug2 fix: only backdrop-filter here, no hardcoded background override.
   Card color CSS vars (--card-pin, --card-lv0 etc.) now fully control the background. */
body.has-bg .pin-card,body.has-bg .lv-card,body.has-bg .pin-slot{backdrop-filter:blur(12px)}

/* ── settings sheet ── */
.stt-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);
  z-index:50;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.stt-overlay.open{opacity:1;pointer-events:all}
.stt-sheet{background:var(--surface);border-radius:16px 16px 0 0;
  padding:20px 20px 32px;width:100%;max-width:480px;
  border:1px solid var(--border);border-bottom:none;
  transform:translateY(100%);transition:transform .25s ease;max-height:80vh;overflow-y:auto}
.stt-overlay.open .stt-sheet{transform:translateY(0)}
.stt-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.stt-hdr span{font-size:.9rem;font-weight:600}
.stt-close{background:none;border:none;cursor:pointer;
  color:var(--dim);padding:4px;line-height:1;font-size:1rem}
.stt-close:active{color:var(--text)}
.stt-section{margin-bottom:22px}
.stt-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--dim);margin-bottom:10px}

/* theme grid */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme-btn{padding:12px 8px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--card);color:var(--text);font-size:.8rem;cursor:pointer;
  font-family:inherit;transition:all .15s;display:flex;flex-direction:column;
  align-items:center;gap:6px}
.theme-btn.active{border-color:var(--lv1)}
.theme-btn:active{opacity:.7}
.theme-swatch{width:28px;height:18px;border-radius:3px}
.sw-dark{background:linear-gradient(135deg,#0d0d0d 50%,#242424 50%)}
.sw-light{background:linear-gradient(135deg,#f0f0f0 50%,#e8e8e8 50%)}
.sw-green{background:linear-gradient(135deg,#0d1f15 50%,#1a3526 50%)}

/* card color rows */
.card-color-rows{display:flex;flex-direction:column;gap:10px}
.card-color-row{display:flex;align-items:center;gap:10px}
.card-color-name{font-size:.78rem;flex:0 0 72px}
.card-cp{width:36px;height:28px;border:1px solid var(--border);border-radius:4px;
  cursor:pointer;padding:2px;background:none;flex-shrink:0}
.card-ca{flex:1;cursor:pointer;accent-color:var(--lv1)}
.card-opacity-val{font-size:.7rem;color:var(--dim);min-width:36px;text-align:right}

/* bg image section */
.bg-actions{display:flex;gap:8px;margin-bottom:12px}
.upload-label{flex:1;padding:10px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;text-align:center;font-size:.82rem;cursor:pointer;color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:6px}
.upload-label input{display:none}
.clear-bg-btn{padding:10px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;font-size:.82rem;cursor:pointer;color:var(--dim);font-family:inherit}
.clear-bg-btn:active{opacity:.7}
.bg-thumbs{display:flex;flex-wrap:wrap;gap:8px}
.bg-thumb{position:relative;width:72px;height:52px;border-radius:4px;overflow:hidden;
  border:1px solid var(--border);flex-shrink:0}
.bg-thumb img{width:100%;height:100%;object-fit:cover}
.bg-thumb-del{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);
  border:none;border-radius:50%;width:18px;height:18px;
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;cursor:pointer;color:#fff;line-height:1}
.bg-thumb.active-bg{outline:2px solid var(--lv1);outline-offset:1px}
/* memos / generic settings inputs */
.stt-input{width:100%;background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;color:var(--text);font-size:.85rem;
  outline:none;margin-bottom:8px;font-family:inherit}
.stt-input:focus{border-color:rgba(255,255,255,.3)}
.stt-btn-row{display:flex;gap:8px;margin-top:2px}
.stt-btn{padding:9px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;font-size:.82rem;cursor:pointer;color:var(--text);font-family:inherit;
  display:flex;align-items:center;gap:5px;flex:1;justify-content:center}
.stt-btn:active{opacity:.7}
.stt-btn.primary{background:var(--lv1);border-color:transparent;color:#fff}
.stt-status{font-size:.75rem;margin-top:8px;min-height:1.2em;color:var(--dim)}
</style>
</head>
<body data-theme="dark">

<div id="bg-layer"></div>

<!-- 右側固定標籤欄 -->
<div class="tab-bar" id="tab-bar">
  <button class="lv-tab" id="lv2-tab" style="display:none" onclick="forceLevel(2)">
    <span class="lv-tab-label">Lv2</span>
    <span class="lv-tab-cnt" id="lv-tab-cnt-2">0</span>
  </button>
  <button class="lv-tab gear-tab" onclick="openSettings()" aria-label="設定">
    <i class="bi bi-gear-fill" style="font-size:.85rem"></i>
    <span style="font-size:.55rem">設定</span>
  </button>
</div>

<!-- 設定 sheet -->
<div class="stt-overlay" id="stt-overlay" onclick="sttOverlayClick(event)">
  <div class="stt-sheet">
    <div class="stt-hdr">
      <span>設定</span>
      <button class="stt-close" onclick="closeSettings()"><i class="bi bi-x-lg"></i></button>
    </div>

    <div class="stt-section">
      <div class="stt-label">配色</div>
      <div class="theme-grid">
        <button class="theme-btn active" data-t="dark" onclick="setTheme('dark')">
          <span class="theme-swatch sw-dark"></span>暗色
        </button>
        <button class="theme-btn" data-t="light" onclick="setTheme('light')">
          <span class="theme-swatch sw-light"></span>亮色
        </button>
        <button class="theme-btn" data-t="green" onclick="setTheme('green')">
          <span class="theme-swatch sw-green"></span>墨綠
        </button>
      </div>
    </div>

    <div class="stt-section">
      <div class="stt-label">卡片背景顏色與透明度</div>
      <div class="card-color-rows">
        <div class="card-color-row">
          <span class="card-color-name"><i class="bi bi-pin-fill"></i> 代辦三格</span>
          <input type="color" class="card-cp" id="cc-pin" value="#242424" oninput="onCardColorChange('pin')">
          <input type="range" class="card-ca" id="ca-pin" min="0" max="1" step="0.01" value="1" oninput="onCardColorChange('pin')">
          <span class="card-opacity-val" id="cv-pin">100%</span>
        </div>
        <div class="card-color-row">
          <span class="card-color-name">Lv0 收件</span>
          <input type="color" class="card-cp" id="cc-lv0" value="#242424" oninput="onCardColorChange('lv0')">
          <input type="range" class="card-ca" id="ca-lv0" min="0" max="1" step="0.01" value="1" oninput="onCardColorChange('lv0')">
          <span class="card-opacity-val" id="cv-lv0">100%</span>
        </div>
        <div class="card-color-row">
          <span class="card-color-name">Lv1 進行</span>
          <input type="color" class="card-cp" id="cc-lv1" value="#242424" oninput="onCardColorChange('lv1')">
          <input type="range" class="card-ca" id="ca-lv1" min="0" max="1" step="0.01" value="1" oninput="onCardColorChange('lv1')">
          <span class="card-opacity-val" id="cv-lv1">100%</span>
        </div>
        <div class="card-color-row">
          <span class="card-color-name">Lv2 子任務</span>
          <input type="color" class="card-cp" id="cc-lv2" value="#242424" oninput="onCardColorChange('lv2')">
          <input type="range" class="card-ca" id="ca-lv2" min="0" max="1" step="0.01" value="1" oninput="onCardColorChange('lv2')">
          <span class="card-opacity-val" id="cv-lv2">100%</span>
        </div>
      </div>
    </div>

    <div class="stt-section">
      <div class="stt-label">標籤欄透明度</div>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="range" id="tab-opacity" class="card-ca" style="flex:1"
          min="0.1" max="1" step="0.05" value="0.7"
          oninput="setTabOpacity(this.value)">
        <span id="tab-opacity-val" style="font-size:.7rem;color:var(--dim);min-width:36px;text-align:right">70%</span>
      </div>
    </div>

    <div class="stt-section">
      <div class="stt-label">Memos 整合</div>
      <input id="memos-url"   type="url"      class="stt-input" placeholder="http://localhost:5230">
      <input id="memos-token" type="password" class="stt-input" placeholder="Access Token" autocomplete="new-password">
      <div class="stt-btn-row">
        <button class="stt-btn primary" onclick="saveMemos()"><i class="bi bi-floppy"></i> 儲存</button>
        <button class="stt-btn"         onclick="testMemos()"><i class="bi bi-wifi"></i> 測試連線</button>
      </div>
      <div class="stt-status" id="memos-status"></div>
    </div>

    <div class="stt-section">
      <div class="stt-label">全域背景圖片</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="font-size:.78rem;color:var(--dim);flex-shrink:0">切換間隔</span>
        <input type="number" id="bg-interval" class="stt-input"
          min="1" max="120" value="1"
          style="width:72px;margin-bottom:0;text-align:center"
          onchange="setBgInterval()">
        <span style="font-size:.78rem;color:var(--dim);flex-shrink:0">分鐘</span>
      </div>
      <div class="bg-actions">
        <label class="upload-label">
          <i class="bi bi-image"></i> 上傳圖片
          <input type="file" accept="image/*" multiple onchange="uploadBgFiles(this)">
        </label>
        <button class="clear-bg-btn" onclick="clearAllBg()">清除全部</button>
      </div>
      <div class="bg-thumbs" id="bg-thumbs"></div>
    </div>
  </div>
</div>

<div class="scenes">
  <!-- 場景一：代辦三格 -->
  <div class="scene" id="scene-pin">
    <div class="pin-hdr">
      <span class="pin-hdr-dot"></span>
      <span class="pin-hdr-title">代辦三格</span>
      <span class="pin-hdr-dot"></span>
    </div>
    <div class="pin-carousel" id="pin-carousel">
      <div class="pin-track" id="pin-track"></div>
    </div>
    <div class="pin-dots" id="pin-dots"></div>
  </div>

  <!-- 場景二：Lv 處理 -->
  <div class="scene" id="scene-lv">
    <div class="lv-hdr">
      <button class="back-btn" onclick="goHome()">
        <span class="back-icon">‹</span> 代辦三格
      </button>
      <span class="lv-badge" id="lvbadge">Lv0</span>
    </div>
    <div class="lv-area">
      <div style="width:100%;max-width:340px">
        <div id="cstage"></div>
        <div class="lv-nav" id="cnav"></div>
      </div>
    </div>
  </div>
</div>

<!-- 輸入框 -->
<div class="input-bar">
  <div class="input-inner">
    <input id="inp" type="text" placeholder="新增到 Lv0 收件匣…" autocomplete="off" autocorrect="off">
    <button class="send-btn" onclick="sendInput()"><i class="bi bi-plus-lg"></i></button>
  </div>
</div>

<!-- modal -->
<div class="overlay" id="overlay" onclick="overlayBg(event)">
  <div class="modal">
    <h3 id="mtitle"></h3>
    <div class="modal-ctx" id="mctx"></div>
    <input id="minp" type="text" placeholder="">
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="modalDone(null)">取消</button>
      <button class="btn btn-ok" onclick="modalDone(document.getElementById('minp').value)">確定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── state ─────────────────────────────────────────────────────────────────
let items    = [];
let pinIdx   = 0;
let lvCardIdx= {0:0,1:0,2:0};
let curScene = 'pin';
let forcedLv = null;
let _carouselAbort = null;

// ── api ───────────────────────────────────────────────────────────────────
async function req(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: body ? {'Content-Type':'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}
const GET   = p     => req('GET',    p);
const POST  = (p,b) => req('POST',   p, b);
const DEL   = p     => req('DELETE', p);
const PATCH = (p,b) => req('PATCH',  p, b);

async function reload() { items = await GET('/api/items'); render(); }

// ── helpers ───────────────────────────────────────────────────────────────
const lvItems = lv => items.filter(i => i.level === lv);
const pinned  = ()  => items.filter(i => i.level === 1 && i.pinned);
const esc     = s   => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function processable(lv) {
  if (lv === 1) return items.filter(i => i.level === 1 && !i.pinned);
  return lvItems(lv);
}
function activeLv() {
  if (processable(0).length) return 0;
  if (processable(1).length) return 1;
  if (processable(2).length) return 2;
  return 0;
}
function clampLvIdx() {
  for (let lv=0;lv<3;lv++) {
    const n = processable(lv).length;
    lvCardIdx[lv] = n ? Math.min(lvCardIdx[lv], n-1) : 0;
  }
}

// ── lv tabs ───────────────────────────────────────────────────────────────
function currentLv() {
  // Lv2 can only be forced when Lv1 still has items to process
  // (sequential GTD flow: clear Lv1 before Lv2 is the natural exit)
  if (forcedLv === 2 && processable(1).length > 0) return 2;
  forcedLv = null;
  return activeLv();
}

function forceLevel(lv) {
  forcedLv = lv;
  lvCardIdx[lv] = Math.max(0, Math.min(lvCardIdx[lv], processable(lv).length - 1));
  renderLvCard();
}

function updateTabBar() {
  const lv2Tab = document.getElementById('lv2-tab');
  if (!lv2Tab) return;
  // Lv2 tab appears only while processing Lv1 (Lv0 empty, Lv1 has items)
  const showLv2 = curScene === 'lv' && processable(1).length > 0;
  lv2Tab.style.display = showLv2 ? 'flex' : 'none';
  if (showLv2) {
    const n = processable(2).length;
    const cnt = document.getElementById('lv-tab-cnt-2');
    if (cnt) cnt.textContent = n;
    lv2Tab.classList.toggle('active', forcedLv === 2);
    lv2Tab.style.opacity = n > 0 ? '' : '0.35';
  }
}

// ── scene switch ──────────────────────────────────────────────────────────
function goLv() {
  curScene = 'lv';
  document.body.classList.add('on-lv');
  renderLvCard();
}
function goHome() {
  curScene = 'pin';
  forcedLv = null;
  document.body.classList.remove('on-lv');
  renderPinned();
}

// ── toast ─────────────────────────────────────────────────────────────────
let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 1800);
}

// ── modal (Bug3 fix: visualViewport aware) ────────────────────────────────
let _mres = null;
function openModal(title, ctx='', ph='') {
  document.getElementById('mtitle').textContent = title;
  document.getElementById('mctx').textContent   = ctx;
  const inp = document.getElementById('minp');
  inp.placeholder = ph; inp.value = '';
  document.getElementById('overlay').classList.add('open');
  syncOverlayToViewport();
  setTimeout(() => inp.focus(), 220);
  return new Promise(res => {
    _mres = res;
    inp.onkeydown = e => { if(e.key==='Enter') modalDone(inp.value); };
  });
}
function modalDone(val) {
  document.getElementById('overlay').classList.remove('open');
  resetOverlaySize();
  if (_mres) { _mres(val===null ? null : (val||'').trim()); _mres = null; }
}
function overlayBg(e) { if(e.target===e.currentTarget) modalDone(null); }

function syncOverlayToViewport() {
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  const ovl = document.getElementById('overlay');
  ovl.style.top    = vv.offsetTop  + 'px';
  ovl.style.left   = vv.offsetLeft + 'px';
  ovl.style.width  = vv.width  + 'px';
  ovl.style.height = vv.height + 'px';
}
function resetOverlaySize() {
  const ovl = document.getElementById('overlay');
  ovl.style.top = ovl.style.left = ovl.style.width = ovl.style.height = '';
}

// ── actions ───────────────────────────────────────────────────────────────
async function doComplete(item) {
  try {
    const r = await POST(`/api/items/${item.id}/complete`, {});
    clampLvIdx(); await reload();
    if (r.memos_error)  toast(`✓ 完成（Memos 失敗：${r.memos_error}）`);
    else if (r.memos_pushed) toast('✓ 完成，已存入 Memos');
    else                toast('✓ 完成');
  } catch(e) {
    clampLvIdx(); await reload(); toast('完成失敗：' + e.message);
  }
}
async function doDelete(item) {
  await DEL(`/api/items/${item.id}`);
  clampLvIdx(); await reload(); toast('已刪除');
}
async function doPromote(item) {
  if (lvItems(1).length >= 10) { toast('Lv1 已滿 10 格'); return; }
  await PATCH(`/api/items/${item.id}`, {level:1});
  clampLvIdx(); await reload(); toast('→ 升到 Lv1');
}
async function doPin(item) {
  if (pinned().length >= 3) { toast('代辦三格已滿'); return; }
  const isThirdPin = (pinned().length === 2);
  await PATCH(`/api/items/${item.id}`, {pinned:true});
  if (isThirdPin) {
    curScene = 'pin';
    document.body.classList.remove('on-lv');
  } else {
    clampLvIdx();
  }
  await reload();
  toast('已釘選');
}
async function doToLv2(item) {
  const tag = await openModal('移動到 Lv2','項目：'+item.content,'分類 tag（可留空）');
  if (tag===null) return;
  const parent_tag = tag || item.content;
  const content    = `[${parent_tag}]`;
  await PATCH(`/api/items/${item.id}`, {level:2, parent_tag, content});
  await reload(); toast('→ 移到 Lv2');
}
async function doToLv3(item) {
  await PATCH(`/api/items/${item.id}`, {level:3});
  clampLvIdx(); await reload(); toast('→ 移到 Lv3');
}
async function doCut(item) {
  const content = await openModal('切項目','從：'+item.content,'新項目內容…');
  if (!content) return;
  const prefix = item.parent_tag ? `[${item.parent_tag}]` : '';
  await POST('/api/items', {content: prefix + content, level:0});
  await reload(); toast('✂ 已切出到 Lv0');
}

// ── card image ────────────────────────────────────────────────────────────
async function uploadCardImage(id, input) {
  if (!input.files[0]) return;
  const blob = await resizeImageToBlob(input.files[0]);
  const fd = new FormData();
  fd.append('file', new File([blob], 'card.jpg', {type:'image/jpeg'}));
  const r = await fetch(`/api/items/${id}/image`, {method:'POST', body:fd});
  input.value = '';
  if (r.ok) { await reload(); toast('已設定卡片背景圖片'); }
}
async function removeCardImage(id) {
  await DEL(`/api/items/${id}/image`);
  await reload(); toast('已移除卡片圖片');
}

function cardImgCtrlHtml(item) {
  const imgIcon = `<i class="bi bi-image"></i>`;
  const del = item.has_image
    ? `<button class="card-img-del" onclick="removeCardImage(${item.id})"><i class="bi bi-x"></i></button>`
    : '';
  return `<div class="card-img-ctrl" onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
    ${del}
    <label class="card-img-btn" title="設定背景圖片">${imgIcon}
      <input type="file" accept="image/*" style="display:none" onchange="uploadCardImage(${item.id},this)">
    </label>
  </div>`;
}

// ── lv card navigation ────────────────────────────────────────────────────
function lvNavigate(dir) {
  const lv = currentLv();
  const n  = processable(lv).length;
  const nx = lvCardIdx[lv] + dir;
  if (nx < 0 || nx >= n) return;
  lvCardIdx[lv] = nx;
  renderLvCard();
}

// ── render: pinned carousel ───────────────────────────────────────────────
function renderPinned() {
  const ps    = pinned();
  const track = document.getElementById('pin-track');
  const dots  = document.getElementById('pin-dots');

  let html = '';
  for (let i=0; i<3; i++) {
    const item = ps[i];
    if (item) {
      const bgStyle = item.has_image
        ? `background-image:url(/api/items/${item.id}/image?v=${item.id});`
        : '';
      const overlay = item.has_image ? '<div class="card-img-overlay"></div>' : '';
      html += `<div class="pin-slide">
        <div class="pin-card" data-id="${item.id}" style="${bgStyle}">
          ${overlay}
          ${cardImgCtrlHtml(item)}
          <div class="pin-card-label"><i class="bi bi-pin-fill"></i> ${i+1} / 3</div>
          <div class="pin-card-body">${esc(item.content)}</div>
          <div class="pin-card-hint"><span>↑ 上滑完成</span></div>
          <div class="swind"></div>
        </div>
      </div>`;
    } else {
      html += `<div class="pin-slide">
        <div class="pin-slot" onclick="goLv()">
          <div class="pin-slot-icon">+</div>
          <div class="pin-slot-txt">加入代辦三格</div>
        </div>
      </div>`;
    }
  }
  track.innerHTML = html;

  pinIdx = Math.min(pinIdx, 2);
  track.style.transform = `translateX(-${pinIdx*100}%)`;
  dots.innerHTML = [0,1,2].map(i => `<div class="dot${i===pinIdx?' on':''}"></div>`).join('');
  attachCarouselSwipe(document.getElementById('pin-carousel'), ps);
}

function setPinIdx(i) {
  pinIdx = Math.max(0, Math.min(2, i));
  document.getElementById('pin-track').style.transform = `translateX(-${pinIdx*100}%)`;
  document.querySelectorAll('.dot').forEach((d,idx) => d.classList.toggle('on', idx===pinIdx));
}

function attachCarouselSwipe(el, ps) {
  // Cancel any previous listeners to prevent accumulation across re-renders
  if (_carouselAbort) _carouselAbort.abort();
  _carouselAbort = new AbortController();
  const sig = _carouselAbort.signal;

  let sx, sy, startIdx, dragging=false;
  const THRESH = 50;

  el.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    startIdx = pinIdx; dragging = true;
    document.getElementById('pin-track').style.transition = 'none';
  }, {passive:true, signal:sig});
  el.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy)) {
      const base = startIdx * 100;
      const pct  = (dx / el.offsetWidth) * 100;
      document.getElementById('pin-track').style.transform = `translateX(${-(base-pct)}%)`;
      if (e.cancelable) e.preventDefault();
    }
  }, {passive:false, signal:sig});
  el.addEventListener('touchend', e => {
    if (!dragging) return; dragging = false;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    document.getElementById('pin-track').style.transition = 'transform .3s cubic-bezier(.4,0,.2,1)';
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx < -THRESH) setPinIdx(startIdx+1);
      else if (dx > THRESH) setPinIdx(startIdx-1);
      else setPinIdx(startIdx);
    } else {
      document.getElementById('pin-track').style.transform = `translateX(-${pinIdx*100}%)`;
      if (dy < -THRESH) { const item=ps[pinIdx]; if(item) flyPinCard(()=>doComplete(item)); }
    }
  }, {passive:true, signal:sig});

  let mdown=false, msx, msy, msi;
  el.addEventListener('mousedown', e=>{ mdown=true; msx=e.clientX; msy=e.clientY; msi=pinIdx; document.getElementById('pin-track').style.transition='none'; }, {signal:sig});
  window.addEventListener('mousemove', e=>{
    if(!mdown) return;
    const dx=e.clientX-msx;
    const base=msi*100, pct=(dx/el.offsetWidth)*100;
    document.getElementById('pin-track').style.transform=`translateX(${-(base-pct)}%)`;
  }, {signal:sig});
  window.addEventListener('mouseup', e=>{
    if(!mdown) return; mdown=false;
    const dx=e.clientX-msx, dy=e.clientY-msy;
    document.getElementById('pin-track').style.transition='transform .3s cubic-bezier(.4,0,.2,1)';
    if(Math.abs(dx)>Math.abs(dy)){
      if(dx<-THRESH) setPinIdx(msi+1); else if(dx>THRESH) setPinIdx(msi-1); else setPinIdx(msi);
    } else {
      document.getElementById('pin-track').style.transform=`translateX(-${pinIdx*100}%)`;
      if(dy<-THRESH){ const item=ps[pinIdx]; if(item) flyPinCard(()=>doComplete(item)); }
    }
  }, {signal:sig});
}

function flyPinCard(action) {
  const track = document.getElementById('pin-track');
  const slides = track.querySelectorAll('.pin-slide');
  const slide  = slides[pinIdx];
  if (!slide) { action(); return; }
  const card = slide.querySelector('.pin-card');
  if (!card) { action(); return; }
  card.style.transition = 'transform .26s ease,opacity .26s ease';
  card.style.transform  = 'translateY(-130%)';
  card.style.opacity    = '0';
  setTimeout(action, 260);
}

// ── render: lv card ───────────────────────────────────────────────────────
function renderLvCard() {
  const stage = document.getElementById('cstage');
  const nav   = document.getElementById('cnav');
  const badge = document.getElementById('lvbadge');
  const lv    = currentLv();
  const list  = processable(lv);
  updateTabBar();

  const all = processable(0).length+processable(1).length+processable(2).length;
  if (!all) {
    badge.textContent='全清 ✓'; badge.className='lv-badge empty';
  } else {
    badge.textContent=`Lv${lv}`; badge.className=`lv-badge lv${lv}`;
  }
  if (!list.length) {
    stage.innerHTML = all
      ? `<div class="empty-state"><span class="e-icon">✓</span><span class="e-txt">Lv${lv} 已清空</span></div>`
      : `<div class="empty-state"><span class="e-icon">🎉</span><span class="e-txt">全部清空了！</span></div>`;
    nav.textContent=''; return;
  }

  const i    = lvCardIdx[lv];
  const item = list[i];
  const HINTS = {
    0:['↑ 升 Lv1','↓ 刪除'],
    1:['↑ 釘選','↓ 刪除','← → 切換','×2 → Lv2'],
    2:['↑ 完成','↓ → Lv3','← → 切換','×2 切項目'],
  };
  const bgStyle = item.has_image
    ? `background-image:url(/api/items/${item.id}/image?v=${item.id});`
    : '';
  const overlay = item.has_image ? '<div class="card-img-overlay"></div>' : '';

  stage.innerHTML = `
    <div class="lv-card lv${lv}" id="ccard" style="${bgStyle}">
      ${overlay}
      ${cardImgCtrlHtml(item)}
      <div class="lv-card-tag">Lv${item.level}${item.parent_tag?' · '+esc(item.parent_tag):''}</div>
      <div class="lv-card-body">${esc(item.content)}</div>
      <div class="lv-card-hints">${HINTS[lv].map(h=>`<span class="hint">${h}</span>`).join('')}</div>
      <div class="swind"></div>
    </div>`;
  nav.textContent = list.length > 1 ? `${i+1} / ${list.length}` : '';

  const card = document.getElementById('ccard');
  const H = {
    0:{up:()=>flyLvCard('up',   ()=>doPromote(item)), down:()=>flyLvCard('down',()=>doDelete(item)),  left:null, right:null, dbl:null},
    1:{up:()=>flyLvCard('up',   ()=>doPin(item)),     down:()=>flyLvCard('down',()=>doDelete(item)),  left:()=>lvNavigate(1), right:()=>lvNavigate(-1), dbl:()=>doToLv2(item)},
    2:{up:()=>flyLvCard('up',   ()=>doComplete(item)),down:()=>flyLvCard('down',()=>doToLv3(item)),   left:()=>lvNavigate(1), right:()=>lvNavigate(-1), dbl:()=>doCut(item)},
  }[lv];
  swipeable(card, H);
}

function flyLvCard(dir, action) {
  const card = document.getElementById('ccard');
  if (!card) { action(); return; }
  const T={up:'translateY(-130%)',down:'translateY(130%)',left:'translateX(-130%)',right:'translateX(130%)'};
  card.style.transition='transform .24s ease,opacity .24s ease';
  card.style.transform=T[dir]; card.style.opacity='0';
  setTimeout(action, 240);
}

// ── swipe engine ──────────────────────────────────────────────────────────
function swipeable(el, {up,down,left,right,dbl}) {
  let sx,sy,active=false,lastTap=0;
  const THRESH=55, noLR=!left&&!right;
  const s=(cx,cy)=>{ sx=cx;sy=cy;active=true;el.style.transition='none'; };
  const m=(cx,cy)=>{
    if(!active) return;
    const dx=cx-sx,dy=cy-sy,h=Math.abs(dx)>Math.abs(dy);
    let tx=0,ty=0;
    if(h&&!noLR) tx=Math.sign(dx)*Math.min(Math.abs(dx),THRESH*1.5);
    else if(!h)  ty=Math.sign(dy)*Math.min(Math.abs(dy),THRESH*1.5);
    el.style.transform=`translate(${tx}px,${ty}px) rotate(${tx*.025}deg)`;
    const ov=el.querySelector('.swind');
    if(ov){
      const abs=Math.max(Math.abs(tx),Math.abs(ty));
      if(abs>14){
        ov.style.opacity=Math.min(abs/(THRESH*1.5),.85);
        if(!h){ov.textContent=dy<0?'↑':'↓';ov.style.background=dy<0?'rgba(107,203,119,.28)':'rgba(255,78,106,.28)';}
        else{ov.textContent=dx>0?'←':'→';ov.style.background='rgba(255,255,255,.07)';}
      } else ov.style.opacity=0;
    }
  };
  const e=(cx,cy)=>{
    if(!active) return; active=false;
    const dx=cx-sx,dy=cy-sy,h=Math.abs(dx)>Math.abs(dy);
    el.style.transition='transform .15s ease'; el.style.transform='';
    const ov=el.querySelector('.swind'); if(ov) ov.style.opacity=0;
    if(h&&!noLR){ if(dx<-THRESH&&left){left();return;} if(dx>THRESH&&right){right();return;} }
    else if(!h){ if(dy<-THRESH&&up){up();return;} if(dy>THRESH&&down){down();return;} }
    if(dbl&&Math.abs(dx)<12&&Math.abs(dy)<12){
      const now=Date.now();
      if(now-lastTap<320){dbl();lastTap=0;} else lastTap=now;
    }
  };
  el.addEventListener('touchstart',ev=>{const t=ev.touches[0];s(t.clientX,t.clientY);},{passive:true});
  el.addEventListener('touchmove', ev=>{const t=ev.touches[0];m(t.clientX,t.clientY);if(ev.cancelable)ev.preventDefault();},{passive:false});
  el.addEventListener('touchend',  ev=>{const t=ev.changedTouches[0];e(t.clientX,t.clientY);},{passive:true});
  el.addEventListener('mousedown', ev=>s(ev.clientX,ev.clientY));
  window.addEventListener('mousemove',ev=>{if(ev.buttons===1)m(ev.clientX,ev.clientY);});
  window.addEventListener('mouseup',  ev=>{if(active)e(ev.clientX,ev.clientY);});
}

// ── input ─────────────────────────────────────────────────────────────────
async function sendInput() {
  const inp=document.getElementById('inp');
  const val=inp.value.trim(); if(!val) return;
  inp.value='';
  await POST('/api/items',{content:val,level:0});
  await reload(); toast('已加入 Lv0');
}
document.getElementById('inp').addEventListener('keydown',e=>{ if(e.key==='Enter') sendInput(); });

function render() {
  if (curScene==='pin') { renderPinned(); updateTabBar(); }
  else renderLvCard();
}

// ── keyboard / viewport (Bug3 fix) ────────────────────────────────────────
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const vv = window.visualViewport;
    document.body.style.height = vv.height + 'px';
    // keep modal overlay within the visible area (above keyboard)
    const ovl = document.getElementById('overlay');
    if (ovl.classList.contains('open')) {
      ovl.style.top    = vv.offsetTop  + 'px';
      ovl.style.left   = vv.offsetLeft + 'px';
      ovl.style.width  = vv.width  + 'px';
      ovl.style.height = vv.height + 'px';
    }
  });
}

// ── settings ──────────────────────────────────────────────────────────────
// Theme-default card colors (used when no custom setting saved)
const THEME_CARDS = {dark:'#242424', light:'#e8e8e8', green:'#1a3526'};

let cfg = {
  theme: 'dark',
  bgImages: [],
  bgIndex: 0,
  bgInterval: 1,
  tabOpacity: 0.7,
  cardColors: null,  // null = use theme defaults
};
let bgTimer = null;

async function loadCfg() {
  try {
    const s = await GET('/api/settings');
    if (s && typeof s === 'object') cfg = { ...cfg, ...s };
  } catch(e) {}
}
function saveCfg() {
  POST('/api/settings', cfg).catch(() => toast('儲存設定失敗'));
}

function setTheme(t) {
  cfg.theme = t;
  document.body.dataset.theme = t;
  document.querySelectorAll('.theme-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.t === t));
  applyCardColors();
  saveCfg();
}

// ── Bug2 fix: card colors ─────────────────────────────────────────────────
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function applyCardColors() {
  const cc = cfg.cardColors || {};
  const themeCard = THEME_CARDS[cfg.theme || 'dark'] || '#242424';
  for (const k of ['pin','lv0','lv1','lv2']) {
    const c = cc[k] || {color: themeCard, opacity: 1};
    // Set CSS var directly — this has priority over any CSS rule
    document.documentElement.style.setProperty(`--card-${k}`, hexToRgba(c.color, c.opacity));
    const cp = document.getElementById(`cc-${k}`);
    const ca = document.getElementById(`ca-${k}`);
    const cv = document.getElementById(`cv-${k}`);
    if (cp) cp.value = c.color;
    if (ca) ca.value = String(c.opacity);
    if (cv) cv.textContent = Math.round(c.opacity * 100) + '%';
  }
}

function onCardColorChange(key) {
  const color   = document.getElementById(`cc-${key}`).value;
  const opacity = parseFloat(document.getElementById(`ca-${key}`).value);
  document.getElementById(`cv-${key}`).textContent = Math.round(opacity * 100) + '%';
  if (!cfg.cardColors) cfg.cardColors = {};
  cfg.cardColors[key] = {color, opacity};
  document.documentElement.style.setProperty(`--card-${key}`, hexToRgba(color, opacity));
  saveCfg();
}

// ── background images ─────────────────────────────────────────────────────
function resizeImageToBlob(file) {
  return new Promise(res => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1280;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob(blob => res(blob), 'image/jpeg', 0.75);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadBgFiles(input) {
  const files = Array.from(input.files);
  for (const f of files) {
    const blob = await resizeImageToBlob(f);
    const fd = new FormData();
    fd.append('file', new File([blob], f.name, {type:'image/jpeg'}));
    const r = await fetch('/api/backgrounds', {method:'POST', body:fd});
    if (r.ok) { const d = await r.json(); cfg.bgImages.push(d.name); }
  }
  input.value = '';
  saveCfg(); renderBgThumbs(); applyBg(); startBgRotation();
}

async function removeBgAt(i) {
  const name = cfg.bgImages[i];
  try { await DEL(`/api/backgrounds/${name}`); } catch(e) {}
  cfg.bgImages.splice(i, 1);
  if (cfg.bgIndex >= cfg.bgImages.length) cfg.bgIndex = 0;
  saveCfg(); renderBgThumbs(); applyBg(); startBgRotation();
}

async function clearAllBg() {
  for (const name of cfg.bgImages) { try { await DEL(`/api/backgrounds/${name}`); } catch(e) {} }
  cfg.bgImages = []; cfg.bgIndex = 0;
  saveCfg(); renderBgThumbs(); applyBg(); clearInterval(bgTimer);
}

function applyBg() {
  const layer = document.getElementById('bg-layer');
  if (!cfg.bgImages.length) {
    layer.classList.remove('on');
    document.body.classList.remove('has-bg');
    setTimeout(() => { layer.style.backgroundImage = ''; }, 800);
    return;
  }
  const name = cfg.bgImages[cfg.bgIndex];
  layer.style.backgroundImage = `url(/api/backgrounds/${name})`;
  requestAnimationFrame(() => {
    layer.classList.add('on');
    document.body.classList.add('has-bg');
  });
}

function rotateBg() {
  if (cfg.bgImages.length < 2) return;
  cfg.bgIndex = (cfg.bgIndex + 1) % cfg.bgImages.length;
  const layer = document.getElementById('bg-layer');
  layer.style.transition = 'opacity .8s ease';
  layer.style.opacity = '0';
  setTimeout(() => {
    layer.style.backgroundImage = `url(/api/backgrounds/${cfg.bgImages[cfg.bgIndex]})`;
    layer.style.opacity = '1';
  }, 800);
  renderBgThumbs();
}

function startBgRotation() {
  clearInterval(bgTimer);
  if (cfg.bgImages.length > 1)
    bgTimer = setInterval(rotateBg, (cfg.bgInterval || 1) * 60 * 1000);
}

function applyTabOpacity() {
  const bar = document.getElementById('tab-bar');
  if (bar) bar.style.opacity = cfg.tabOpacity ?? 0.7;
}

function setTabOpacity(v) {
  cfg.tabOpacity = parseFloat(v);
  const val = document.getElementById('tab-opacity-val');
  if (val) val.textContent = Math.round(v * 100) + '%';
  applyTabOpacity();
  saveCfg();
}

function setBgInterval() {
  const v = parseInt(document.getElementById('bg-interval').value) || 1;
  cfg.bgInterval = Math.max(1, v);
  document.getElementById('bg-interval').value = cfg.bgInterval;
  saveCfg();
  startBgRotation();
}

function renderBgThumbs() {
  const wrap = document.getElementById('bg-thumbs');
  if (!wrap) return;
  wrap.innerHTML = cfg.bgImages.map((name, i) => `
    <div class="bg-thumb${i===cfg.bgIndex?' active-bg':''}">
      <img src="/api/backgrounds/${name}" loading="lazy">
      <button class="bg-thumb-del" onclick="removeBgAt(${i})"><i class="bi bi-x"></i></button>
    </div>`).join('');
}

// ── Memos settings ────────────────────────────────────────────────────────
async function loadMemosConfig() {
  try {
    const r = await GET('/api/memos/config');
    const urlInp = document.getElementById('memos-url');
    const tokInp = document.getElementById('memos-token');
    if (urlInp) urlInp.value = r.url || '';
    if (tokInp) tokInp.placeholder = r.token_set ? `已設定 (${r.token_masked})` : 'Access Token';
  } catch(e) {}
}

async function saveMemos() {
  const url   = (document.getElementById('memos-url').value   || '').trim();
  const token = (document.getElementById('memos-token').value || '').trim();
  const st    = document.getElementById('memos-status');
  if (!url) { st.textContent = '請輸入 Memos 網址'; st.style.color = 'var(--lv1)'; return; }
  st.textContent = '儲存中…'; st.style.color = 'var(--dim)';
  try {
    await POST('/api/memos/config', {url, token: token || undefined});
    document.getElementById('memos-token').value = '';
    await loadMemosConfig();
    st.textContent = '已儲存'; st.style.color = 'var(--lv3)';
  } catch(e) {
    st.textContent = '儲存失敗：' + e.message; st.style.color = 'var(--lv1)';
  }
}

async function testMemos() {
  const st = document.getElementById('memos-status');
  st.textContent = '測試中…'; st.style.color = 'var(--dim)';
  try {
    const r = await GET('/api/memos/test');
    st.textContent = r.ok ? `連線成功 (${r.url})` : `連線失敗：${r.error}`;
    st.style.color  = r.ok ? 'var(--lv3)' : 'var(--lv1)';
  } catch(e) {
    st.textContent = '測試失敗：' + e.message; st.style.color = 'var(--lv1)';
  }
}

function openSettings() {
  renderBgThumbs();
  applyCardColors();
  loadMemosConfig();
  const bgInp = document.getElementById('bg-interval');
  if (bgInp) bgInp.value = cfg.bgInterval || 1;
  const tabOp = document.getElementById('tab-opacity');
  const tabOpVal = document.getElementById('tab-opacity-val');
  const v = cfg.tabOpacity ?? 0.7;
  if (tabOp) tabOp.value = v;
  if (tabOpVal) tabOpVal.textContent = Math.round(v * 100) + '%';
  document.getElementById('stt-overlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('stt-overlay').classList.remove('open');
}
function sttOverlayClick(e) { if (e.target===e.currentTarget) closeSettings(); }

function applyCfg() {
  document.body.dataset.theme = cfg.theme || 'dark';
  document.querySelectorAll('.theme-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.t === cfg.theme));
  applyCardColors();
  applyTabOpacity();
  applyBg();
  startBgRotation();
}

// ── boot ──────────────────────────────────────────────────────────────────
async function boot() {
  await loadCfg();
  applyCfg();
  reload();
}
boot();
</script>
